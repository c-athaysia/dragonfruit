# Dragonfruit is Mango with a canvas bolted on.
# Every Mango option still works as is.
# The canvas_ keys and dispatches are listed in the README.
# More Mango options: https://github.com/DreamMaoMao/mango/wiki/

# Window effects
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animations. The types are zoom and slide.
# tag_animation_direction is 1 for horizontal, 0 for vertical.
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller layout
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-stack layout
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle layout
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Overview
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
title_message_bar_height=52
title_message_bar_gap=20
workspace_overview_border_width=2
workspace_overview_gap=5
workspace_overview_drag_threshold=5
workspace_overview_occupied_keep_seen_tags=1
workspace_overview_scroll_direction=vertical
workspace_overview_scroll_ratio=0.8
workspace_overview_drag_scroll_speed=1.5
workspace_overview_scroll_decel_start_interval=50
workspace_overview_scroll_decel_gain=0.5
workspace_overview_focused_dim_opacity=0.0
workspace_overview_unfocused_dim_opacity=0.2
# Unset, the workspace overview animates with animation_*_move like the canvas
# overview. Mango's own defaults were:
# animation_duration_workspace_overview_open=260
# animation_duration_workspace_overview_close=260
# animation_duration_workspace_overview_move=382
# animation_curve_workspace_overview_open=0.333333,1.0,0.666667,1.0
# animation_curve_workspace_overview_close=0.333333,1.0,0.666667,1.0
# animation_curve_workspace_overview_move=0.26,0.99,0.26,1.0

# Misc
no_border_when_single=0
# 0 means every scroll notch counts.
# Mango's default is 100, which made a fast wheel spin over the zoom binds below register as only about one notch.
axis_bind_apply_timeout=0
focus_on_activate=1
axis_bind_apply_timeout=100
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
# Drag windows around freely.
# Let go within snap_distance (in canvas units) of another window and it slides next to it, leaving the tiling gap.
enable_floating_snap=1
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# Keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# Needs a relogin to apply.
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# Mouse
# Needs a relogin to apply.
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=4
root_color=0x201b14ff
border_color=0x444444ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0xc9b890ff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# The canvas is the only layout. Every tag is its own infinite plane.
# A tag_rule layout_name and the setlayout and switch_layout dispatches still parse, but do nothing.
# canvas_shader=grain        # Or dots, plus, or a path to your own .glsl.
canvas_placement=auto-compact

# Keybinds
# Key names come from the output of xev or wev.
# Modifier names are super, ctrl, alt, shift and none.

# Reload the config
bind=SUPER,r,reload_config

# Menu and terminal
bind=Alt,space,spawn,rofi -show drun
bind=Alt,Return,spawn,foot

# Quit and kill
bind=SUPER,m,quit
bind=ALT,q,killclient,

# Move focus
bind=SUPER,Tab,canvas_overview
# Binds in key_mode=workspace_overview run first while it is open.
# Each bind type replaces the built-in input of that type. Example:
# key_mode=workspace_overview
# mousebind=NONE,btn_left,workspace_overview_drag
# mousebind=SUPER,btn_right,workspace_overview_drag,move
# axisbind=NONE,DOWN,workspace_overview_select,down
# key_mode=default

bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# Window states
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,canvas_jump
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# Camera. Hold the arrows to pan. The number is the speed, and 5 is normal.
bind=SUPER,Left,canvas_pan,-5,0
bind=SUPER,Right,canvas_pan,5,0
bind=SUPER,Up,canvas_pan,0,-5
bind=SUPER,Down,canvas_pan,0,5
bind=SUPER,c,canvas_center_window
bind=SUPER,Home,canvas_reset_camera
bind=SUPER,t,canvas_cascade
# Zoom only goes out. 100 is the maximum.
bind=SUPER,minus,canvas_zoom_out
bind=SUPER,equal,canvas_zoom_in
bind=SUPER,0,canvas_zoom,0,100

# Switch tags
bind=CTRL,Left,viewtoleft_have_client,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# tag moves the window to the tag and focuses it.
# tagsilent moves it without focusing it.
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# Monitors
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# Gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# There are no exchange_client, movewin or resizewin binds.
# exchange_client and resizewin act on tiling state that the canvas ignores,
# and movewin floats the window, which pulls it off the plane.

# Mouse buttons
# btn_left and btn_right can't be bound without a modifier key.
# Super+left-drag grabs the plane, and letting go flings it.
# Super+right-drag moves a window, or draws a selection band on empty canvas.
mousebind=SUPER,btn_left,canvas_drag
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curmove
mousebind=SUPER+SHIFT,btn_right,moveresize,curresize
# Binds in key_mode=switcher run first while the switcher is open.
# One mousebind there replaces the built-in switcher clicks. Example:
# key_mode=switcher
# mousebind=ALT,btn_middle,switcher_pick,pointer
# bind=ALT,Escape,switcher_close
# key_mode=default


# Scroll wheel
axisbind=SUPER,UP,canvas_zoom_in
axisbind=SUPER,DOWN,canvas_zoom_out

# Gestures
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# Layer rules
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi
